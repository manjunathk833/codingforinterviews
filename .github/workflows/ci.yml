name: CI - Unified Quality & Security Gate

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "mock-interviews/**"
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - "docs/**"
      - "mock-interviews/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: ⚡ Unified CI Gate (Safety, DSA, Frameworks & Learning Hub)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Make Scripts Executable
        run: |
          chmod +x tools/safety/safety_check.sh
          chmod +x tools/safety/pedagogy_lint.py
          chmod +x run.sh
          chmod +x tools/runner.py
          chmod +x tools/tracker.py
          chmod +x tools/cycle.py

      - name: "🛡️ Stage 1/4: Pre-Push & Secret Safety Audit"
        run: |
          ./tools/safety/safety_check.sh
          ./tools/safety/pedagogy_lint.py --strict

      - name: "🧩 Stage 2/4: DSA Solutions & Curriculum Trackers"
        run: |
          python3 tools/tracker.py summary
          python3 tools/cycle.py status
          python3 tools/cycle.py next
          ./run.sh test-completed

      - name: "🏗️ Stage 3/4: Frameworks, AeroCart AUT & System Design Katas"
        run: |
          for f in frameworks/design-challenges/*/solution.py; do
            echo "Testing $f..."
            python3 "$f"
          done
          mkdir -p .build/ci-java
          for f in frameworks/design-challenges/*/Solution.java; do
            dir=$(dirname "$f")
            name=$(basename "$dir")
            echo "Compiling & executing $name ($f)..."
            mkdir -p ".build/ci-java/$name"
            javac -d ".build/ci-java/$name" "$f"
            java -ea -cp ".build/ci-java/$name" Solution
          done
          python3 frameworks/sdet-system-design/01-distributed-concurrency-isolation/naive_baseline.py
          python3 frameworks/sdet-system-design/01-distributed-concurrency-isolation/reference_solution.py
          mkdir -p .build/ci-java/01-concurrency
          javac -d .build/ci-java/01-concurrency frameworks/sdet-system-design/01-distributed-concurrency-isolation/Solution.java
          java -ea -cp .build/ci-java/01-concurrency Solution
          python3 -m py_compile $(find frameworks/ core-cs/ system-design/ ai-engineering/ apps/ tools/ hub/ -name "*.py")

      - name: "🌐 Stage 4/4: Learning Hub 10-Suite CI & Live HTTP Smoke Test"
        run: |
          python3 hub/tests/test_hub_phase1.py
          python3 hub/server.py --port 8090 &
          HUB_PID=$!
          trap 'kill $HUB_PID 2>/dev/null || true; wait $HUB_PID 2>/dev/null || true' EXIT
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:8090/api/health >/dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8090/api/health | grep -q '"status": "UP"'
          curl -fsS http://127.0.0.1:8090/api/dashboard | grep -q '"readinessScore"'
          curl -fsS http://127.0.0.1:8090/api/feed | grep -q '"cards"'
          curl -fsS http://127.0.0.1:8090/api/visualizers | grep -q '"dsa-group-anagrams"'
          curl -fsS http://127.0.0.1:8090/api/tracks | grep -q '"interactive-textbook"'
          curl -fsS http://127.0.0.1:8090/api/kb/courses | grep -q '"Textbook Courses"'
          curl -fsS "http://127.0.0.1:8090/api/kb/search?q=LSM-Tree" | grep -q '"cs-03-lsm-trees-b-trees-and-wal-isolation"'
          curl -fsS http://127.0.0.1:8090/api/newsfeed | grep -q '"articles"'
          kill $HUB_PID 2>/dev/null || true
          wait $HUB_PID 2>/dev/null || true
